<text x="76" y="891" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Repos, builds, releases</text>
<text x="76" y="922" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Policy + recovery</text>
<rect x="392" y="809" width="314" height="143" rx="12" fill="#f7f4ee" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="414" y="852" font-size="29" fill="#26343c" font-weight="700" text-anchor="start">Evidence</text>
<text x="414" y="891" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Traces, evals, costs</text>
<text x="414" y="922" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Production telemetry</text>
<rect x="54" y="983" width="652" height="112" rx="12" fill="#dde6d9" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="76" y="1022" font-size="27" fill="#26343c" font-weight="700" text-anchor="start">Products on production runtimes</text>
<text x="76" y="1064" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Applications · workflows · agents</text>
<path d="M211 952 V983" fill="none" stroke="#59666b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M549 983 V952" fill="none" stroke="#59666b" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
