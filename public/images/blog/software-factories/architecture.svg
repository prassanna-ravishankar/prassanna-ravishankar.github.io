<path d="M211 317 V292" fill="none" stroke="#59666b" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M255 478 V565" fill="none" stroke="#59666b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="281" y="528" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Use platform services</text>
