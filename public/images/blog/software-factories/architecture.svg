<title id="title">An adaptive factory on a shared platform</title><desc id="desc">The factory layer discovers the problem, designs its organisation, executes work, evaluates evidence, and retains experience in shared state. The platform supplies execution, access, delivery, and observation to factory workers and their products.</desc>
