<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1180" viewBox="0 0 760 1180" role="img" aria-labelledby="title desc">
<title id="title">The factory and the platform</title><desc id="desc">The factory layer contains planning, construction, evaluation, and shared work state. It uses the software and agent platform for execution, access, delivery, and evidence. Its applications, workflows, and agents run on production infrastructure within that platform. Telemetry informs further factory work.</desc>
<rect width="760" height="1180" fill="#f7f4ee"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#59666b" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="57" font-size="29" fill="#26343c" font-weight="700" text-anchor="start">The factory and the platform</text>
<rect x="30" y="93" width="700" height="385" rx="12" fill="#eed9bd" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="54" y="135" font-size="24" fill="#26343c" font-weight="700" text-anchor="start">FACTORY LAYER</text>
<rect x="54" y="163" width="314" height="129" rx="12" fill="#f7f4ee" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="76" y="206" font-size="26" fill="#26343c" font-weight="700" text-anchor="start">Plan + investigate</text>
<text x="76" y="245" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Intent, evidence, tasks</text>
<rect x="392" y="163" width="314" height="129" rx="12" fill="#f7f4ee" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="414" y="206" font-size="28" fill="#26343c" font-weight="700" text-anchor="start">Construct</text>
<text x="414" y="245" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Code, tools, agents</text>
<rect x="54" y="317" width="314" height="129" rx="12" fill="#f7f4ee" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="76" y="360" font-size="28" fill="#26343c" font-weight="700" text-anchor="start">Evaluate</text>
<text x="76" y="399" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Acceptance + critique</text>
<rect x="392" y="317" width="314" height="129" rx="12" fill="#f7f4ee" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="414" y="360" font-size="26" fill="#26343c" font-weight="700" text-anchor="start">Shared work state</text>
<text x="414" y="399" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Plans, findings, artefacts</text>
