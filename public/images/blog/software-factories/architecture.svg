<text x="76" y="723" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Managed sandboxes</text>
<text x="76" y="754" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Durable runs + models</text>
<rect x="392" y="641" width="314" height="143" rx="12" fill="#f7f4ee" stroke="#9aa3a2" stroke-width="1.4"/>
<text x="414" y="684" font-size="29" fill="#26343c" font-weight="700" text-anchor="start">Access</text>
