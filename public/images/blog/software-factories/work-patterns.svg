<svg xmlns="http://www.w3.org/2000/svg" width="760" height="970" viewBox="0 0 760 970" role="img" aria-labelledby="title desc">
<title id="title">One factory, several ways to work</title><desc id="desc">Parallel exploration, coordinated specialists, and explicit workflows are different arrangements of the same primitives. They can be combined and revised as the task develops. Lines show collaboration; arrows show directed dependencies.</desc>
