<text x="64" y="749" font-size="28" fill="#26343c" font-weight="700" text-anchor="start">Retain useful capabilities</text>
<text x="64" y="788" font-size="25" fill="#59666b" font-weight="400" text-anchor="start">Workflows · skills · tools · tested patterns</text>
